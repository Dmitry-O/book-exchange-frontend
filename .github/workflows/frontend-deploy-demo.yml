name: Frontend Demo Deploy

on:
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        description: Create CloudFront invalidation after upload
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  deploy:
    name: Build and Upload to S3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$FRONTEND_S3_BUCKET" || { echo "Missing repository variable FRONTEND_S3_BUCKET"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "Missing repository variable CLOUDFRONT_DISTRIBUTION_ID"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing repository variable VITE_API_BASE_URL"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        shell: bash
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_S3_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

      - name: Upload entry point without long cache
        shell: bash
        run: |
          aws s3 cp dist/index.html "s3://$FRONTEND_S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        if: ${{ inputs.invalidate_cloudfront }}
        shell: bash
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
